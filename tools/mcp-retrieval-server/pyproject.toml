[project]
name = "hbc-mcp-retrieval"
version = "0.1.0"
description = "MCP Retrieval Server for HBC Project Controls Codified Context"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "scikit-learn>=1.5.0",
    "numpy>=2.0.0",
]

[project.scripts]
hbc-mcp = "server:app"